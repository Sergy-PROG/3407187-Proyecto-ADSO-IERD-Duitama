services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./escuelaIERD/escuelaIERD/backend
    ports:
      - "5000:5000"
    env_file:
      - ./escuelaIERD/escuelaIERD/backend/.env
    environment:
      DB_HOST: db
    depends_on:
      - db

  frontend:
    build:
      context: ./escuelaIERD/escuelaIERD
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data: